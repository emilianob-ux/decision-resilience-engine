[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-resilience-engine"
version = "0.3.0"
description = "Decision Resilience Engine (DRE) reference implementation and tooling; includes MAT futures backtesting as a measurement bridge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
  "decision-engine",
  "governance",
  "orchestration",
  "dre",
  "backtest",
  "quantitative-finance",
  "binance",
  "futures",
  "optimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Runtime del motor DRE (contratos + skills numéricos). La API HTTP es opcional
# porque no todo consumidor necesita levantar un servidor: ver extra `api`.
dependencies = [
  "numpy>=1.24,<3",
  "requests>=2.28.0,<3",
  "pydantic>=2,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff==0.16.7",  # pin exacto: ver requirements-dev.txt
  "pre-commit>=4,<5",
  "pydantic>=2,<3",
  "scipy>=1.11,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "fakeredis>=2,<3",
]

[project.urls]
Homepage = "https://github.com/emilianob-ux/decision-resilience-engine"
Documentation = "https://github.com/emilianob-ux/decision-resilience-engine/blob/main/docs/tutorial_quickstart.md"
Repository = "https://github.com/emilianob-ux/decision-resilience-engine"
Issues = "https://github.com/emilianob-ux/decision-resilience-engine/issues"
PyPI = "https://pypi.org/project/decision-resilience-engine/"

[tool.setuptools]
py-modules = ["compound_optimize_runner", "leverage_pi"]

# El paquete se llama decision-resilience-engine, así que la wheel incluye el motor
# `dre/`. `features*` son los módulos MAT usados como puente de medición.
[tool.setuptools.packages.find]
where = ["."]
include = ["dre*", "features*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Estilo compacto heredado del runner principal; migracion gradual posible.
"compound_optimize_runner.py" = ["E701", "E702"]
